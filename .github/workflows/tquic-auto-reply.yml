name: Auto_reply
on:
  discussion:
    types: [created]

jobs:
  auto-reply:
    runs-on: ubuntu-latest
    permissions:
      discussions: write
      models: read
    steps:
      - name: Checkout respository
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openai requests

      - name: Auto reply with Github AI
        env:
          # Github token, auto fetch
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disscussion message
          DISCUSSION_ID: ${{ github.event.discussion.id }}
          DISCUSSION_TITLE: ${{ github.event.discussion.title }}
          DISCUSSION_BODY: ${{ github.event.discussion.body }}
          REPO_OWNER: ${{ github.event.repository.owner.login }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          python << EOF
          import os
          from openai import OpenAI
          import requests

          # 1. Init GitHub Model client
          client = OpenAI(
              base_url="https://models.inference.ai.github.com/v1",
              api_key=os.getenv("GITHUB_TOKEN")
          )

          # 2. create prompt
          prompt = f"""
            Please reply to questions on GitHub Discussion in a friendly and professional tone, with the following requirements:
            1. Provide precise answers that target the title 「{os.getenv('DISCUSSION_TITLE')}」 and content 「{os.getenv('DISCUSSION_BODY')}」;
            2. Answer should be concise, easy to understand and free of redundancy;
            3. If the question is unclear, guide the user to supplement key information.
          """

          # 3. Generate response
          try:
              response = client.chat.completions.create(
                  model="gpt-4o-mini",
                  messages=[{"role": "user", "content": prompt}],
                  temperature=0.7,  # response randomness
                  max_tokens=1000   # max response tokens
              )
              reply_content = response.choices[0].message.content.strip()
          except Exception as e:
              reply_content = f"Sorry, auto reply failed, please wait for replay from other people."
          print(reply_content)

          # 4. Use GitHub API to reply
          headers = {
              "Authorization": f"token {os.getenv('GITHUB_TOKEN')}",
              "Accept": "application/vnd.github.v3+json"
          }
          api_url = f"https://api.github.com/repos/{os.getenv('REPO_OWNER')}/{os.getenv('REPO_NAME')}/discussions/{os.getenv('DISCUSSION_ID')}/comments"
          payload = {"body": reply_content}

          # Send POST request
          res = requests.post(api_url, json=payload, headers=headers)
          if res.status_code == 201:
              print("Auto reply success")
          else:
              print(f"Auto reply failed, status code: {res.status_code}, response: {res.text}")
          EOF