name: Auto_reply
on:
  discussion:
    types: [created]

jobs:
  auto-reply:
    runs-on: ubuntu-latest
    permissions:
      discussions: write
      models: read
    steps:
      - name: Checkout respository
        uses: actions/checkout@v4

      - name: Setup Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install openai requests

      - name: Auto reply with Github AI
        env:
          # Github token, auto fetch
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disscussion message
          DISCUSSION_NUMBER: ${{ github.event.discussion.number }}
          DISCUSSION_TITLE: ${{ github.event.discussion.title }}
          DISCUSSION_BODY: ${{ github.event.discussion.body }}
          REPO_OWNER: ${{ github.event.repository.owner.login }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
            python << EOF
            import os
            from openai import OpenAI
            import requests

            print(f"debug info: disscussion_title:{os.getenv('DISCUSSION_TITLE')}, disscussion_body:{os.getenv('DISCUSSION_BODY')}, repo_owner:{os.getenv('REPO_OWNER')}, repo_name:{os.getenv('REPO_NAME')}, discussion_number:{os.getenv('DISCUSSION_NUMBER')}")

            # 1. Init GitHub Model client
            github_token = os.getenv("GITHUB_TOKEN")
            if not github_token:
                raise ValueError("GITHUB_TOKEN" + "not found in environment variables")

            url = "https://models.github.ai/inference/chat/completions"
            headers = {
                "Content-Type": "application/json",
                "Authorization": f"Bearer {github_token}"  
            }

            prompt = f"""
            Please reply to questions on GitHub Discussion in a friendly and professional tone, with the following requirements:
            1. Provide precise answers that target the title 「{os.getenv('DISCUSSION_TITLE')}」 and content 「{os.getenv('DISCUSSION_BODY')}」;
            2. Answer should be concise, easy to understand and free of redundancy;
            3. If the question is unclear, guide the user to supplement key information.
            """

            payload = {
                "messages": [
                    {
                        "role": "user",
                        "content": prompt
                    }
                ],
                "model": "openai/gpt-4o"
            }
          

            # 3. Generate response
            try:
                response = requests.post(
                    url=url,
                    headers=headers,
                    json=payload,
                    timeout=30  # 30s timeout
                )
                response.raise_for_status()

                response_data = response.json()
                reply_content = response_data["choices"][0]["message"]["content"].strip()
                print("success get reply from ai: " + reply_content)


            except requests.exceptions.Timeout:
                print("error: request timeout")
            except requests.exceptions.ConnectionError:
                print("error: request connection error")
            except requests.exceptions.HTTPError as e:
                print(f"error: API request failed(status code:{response.status_code}), detail:{e.response.text}")
            except KeyError as e:
                print(f"error: format error, lost field:{e}")
            except Exception as e:
                print(f"unknown error: {str(e)}")

            # 4. Use GitHub API to reply
            headers = {
                "Authorization": f"token {os.getenv('GITHUB_TOKEN')}",
                "Accept": "application/vnd.github.v3+json"
            }
            # GitHub Discussions API uses discussion_number
            api_url = f"https://api.github.com/repos/{os.getenv('REPO_OWNER')}/{os.getenv('REPO_NAME')}/discussions/{os.getenv('DISCUSSION_NUMBER')}/comments"
            payload = {"body": reply_content}

            # Send POST request
            res = requests.post(api_url, json=payload, headers=headers)
            if res.status_code == 201:
                print("Auto reply success")
            else:
                print(f"Auto reply failed, status code: {res.status_code}, response: {res.text}")
            EOF